<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Registration</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .registration-container { background-color: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        .registration-container h2 { margin-bottom: 20px; text-align: center; }
        .form-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .form-group { flex: 1; display: flex; flex-direction: column; margin-bottom: 15px; }
        .form-group label { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
        .form-group input, .form-group select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-submit { background-color: #4caf50; color: white; padding: 12px; border: none; border-radius: 4px; cursor: pointer; width: 100%; }
        @media (max-width: 480px) { .form-row { flex-direction: column; gap: 0; } }
    </style>
</head>
<body>
<div class="registration-container">
    <h2>Create Account</h2>
    <form action="/submit-registration" method="POST">
        <div class="form-row">
            <div class="form-group"><label>First Name</label><input type="text" required></div>
            <div class="form-group"><label>Last Name</label><input type="text" required></div>
        </div>
        <div class="form-group"><label>Email</label><input type="email" required></div>
        <div class="form-group"><label>Password</label><input type="password" required minlength="8"></div>
       
        <button type="submit" class="btn-submit">Register</button>
    </form>
</div>
</body>
</html>
